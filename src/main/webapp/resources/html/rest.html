<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Web Service Programming Homework</title>
<link rel="stylesheet" href="../student.css" type="text/css">
<script src="http://code.jquery.com/jquery-3.7.1.js"></script>
</head>
<body>
    <section class="rest-section">
        <div class="rest-header center">

            <button id="request" onClick="sendRequest()">JAX-RS 기반 회원 전체 정보 조회</button>
        </div>
        <div id="target" class="rest-target"></div>
    </section>
    <script>
        $("#request").click(function() {
            $("#target").empty();

            $.ajax({
                url : "http://localhost:8080/pyj-springdb/member/rest/list",
                type : "GET",
                dataType : "json",
                success : function(data) {
                    if(data.length > 0) {
                         alert("SUCCESS- 성공");
                         console.log("SUCCESS- 성공");
                         let table = $("<table/>");

                         let header = $("<tr/>").append(
                            $("<th/>").text("ID"),
                            $("<th/>").text("PWD"),
                            $("<th/>").text("이름"),
                            $("<th/>").text("학번"),
                            $("<th/>").text("학과"),
                            $("<th/>").text("모바일"),
                            $("<th/>").text("이메일")
                         );
                         table.append(header);

                         for(let i in data) {
                             let $id = data[i].id;
                             let $passwd = data[i].passwd;
                             let $username = data[i].username;
                             let $snum = data[i].snum;
                             let $depart = data[i].depart;
                             let $mobile = data[i].mobile;
                             let $email = data[i].email;

                             let row = $("<tr/>").append(
                                 $("<td/>").text($id),
                                 $("<td/>").text($passwd),
                                 $("<td/>").text($username),
                                 $("<td/>").text($snum),
                                 $("<td/>").text($depart),
                                 $("<td/>").text($mobile),
                                 $("<td/>").text($email)
                             );
                             table.append(row);
                         }
                         $("#target").append(table);
                    }
                },
                error: function(request, status, error) { 
                    alert("failure- 통신실패");
                    console.log(error);
                }
            });
        });

        function sendRequest() {
            const xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    document.getElementById("target").innerHTML = xhr.responseText;
                }
            };
            xhr.send();
        }
    </script>
</body>
</html>
